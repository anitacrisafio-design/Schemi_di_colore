<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Limite dell'RGB vs Occhio Umano</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0a0a0c;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #e2e8f0;
        }
        #canvas-container {
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            overflow: hidden;
            background-color: #121214;
        }
        input[type=range] {
            -webkit-appearance: none;
            background: linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
            height: 8px;
            border-radius: 4px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,255,255,0.6);
            border: 2px solid #0a0a0c;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <script>
        let colorSlider;

        function setup() {
            let canvas = createCanvas(900, 560);
            canvas.parent('canvas-container');
            
            colorSlider = createSlider(0, 360, 135); // Default sul Verde/Ciano (dove il limite è massimo)
            colorSlider.position(width / 2 - 250, 505);
            colorSlider.style('width', '500px');
        }

        function draw() {
            background(14, 14, 18);

            let val = colorSlider.value();
            let c = hueToRGB(val);

            // Separatore centrale grafico
            stroke(30);
            line(width / 2, 40, width / 2, 440);
            noStroke();

            // =================================================================
            // SINISTRA: L'OCCHIO E IL COLORE REALE (Spazio Visivo Totale)
            // =================================================================
            fill(255); textSize(16); textStyle(BOLD);
            text("1. Spettro Visivo Umano (Realtà)", 50, 45);
            
            fill(140); textSize(11); textStyle(NORMAL);
            text("IL POTENZIALE DELLA NATURA E DELLA RETINA", 50, 65);

            // Disegniamo la forma a "Ferro di Cavallo" (Semplificata per p5) che rappresenta il Gamut Umano
            push();
            translate(180, 240);
            
            // Sfondo dello spazio colore visibile
            noStroke();
            fill(30, 30, 35);
            beginShape();
            vertex(-100, 80);  // Blu profondo
            vertex(-80, -40);  // Ciano naturale
            vertex(0, -110);   // Verde smeraldo puro
            vertex(80, -60);   // Giallo
            vertex(110, 30);   // Rosso vivo
            vertex(40, 80);    // Magenta/Viola
            endShape(CLOSE);

            // Il TRIANGOLO RGB (Il limite fisico dei display) impresso sopra lo spazio umano
            stroke(255, 80);
            strokeWeight(1.5);
            noFill();
            // Vertici fissi del display (Rosso, Verde, Blu standard)
            let rX = 85, rY = 25;
            let gX = -10, gY = -85;
            let bX = -75, bY = 65;
            triangle(rX, gX, gX, gY, bX, bY);

            // Indicatore del colore selezionato nello spazio reale
            let targetX = map(val, 0, 360, -80, 100);
            let targetY = sin(map(val, 0, 360, 0, TWO_PI)) * 50 - 20;
            
            // Curva dello spettro reale esterno
            stroke(100); strokeWeight(1); noFill();
            
            // Pallino che si muove: mostra dove si trova il colore reale
            noStroke();
            fill(c.r, c.g, c.b);
            ellipse(targetX, targetY, 20, 20);
            stroke(255); strokeWeight(2); noFill();
            ellipse(targetX, targetY, 26, 26);
            pop();

            // Cerchio del colore teorico "puro" che l'occhio vorrebbe vedere
            noStroke();
            fill(c.r, c.g, c.b);
            ellipse(80, 140, 60, 60);
            fill(200); textSize(12); textStyle(BOLD);
            text("Colore Naturale", 125, 135);
            fill(120); textSize(11); textStyle(NORMAL);
            text("Percepibile dai coni", 125, 150);


            // =================================================================
            // DESTRA: IL DISPLAY RGB (L'Approssimazione)
            // =================================================================
            fill(255); textSize(16); textStyle(BOLD);
            text("2. Limite del Display (RGB)", 500, 45);
            
            fill(140); textSize(11); textStyle(NORMAL);
            text("LA TRADUZIONE FORZATA NEI TRE PRIMARI", 500, 65);

            // Cerchio del colore clonato dal display
            noStroke();
            fill(c.r, c.g, c.b);
            ellipse(530, 140, 60, 60);
            
            // Calcolo della perdita di saturazione (Simulata per evidenziare il concetto)
            // Più ci si avvicina ai verdi/ciani puri dello slider, più lo schermo fatica
            let distorsione = 0;
            if (val > 100 && val < 200) { 
                distorsione = map(stroke, 100, 200, 0, 40); // Picco di perdita nel verde/ciano
            }
            
            fill(200); textSize(12); textStyle(BOLD);
            text("Colore dello Schermo", 575, 135);
            fill(239, 68, 68); textSize(11); textStyle(NORMAL);
            if (val > 120 && val < 180) {
                text("ATTENZIONE: Colore clonato e appiattito", 575, 150);
            } else {
                text("Compresso nei limiti del triangolo", 575, 150);
            }

            // Subpixel fisici che cercano di simulare il punto nel grafico
            let startX = 500;
            let startY = 240;
            let subW = 45;
            let subH = 120;

            // Render Subpixel con effetto luce/glow
            noStroke();
            fill(c.r, 0, 0); rect(startX, startY, subW, subH, 6);
            fill(0, c.g, 0); rect(startX + subW + 12, startY, subW, subH, 6);
            fill(0, 0, c.b); rect(startX + (subW * 2) + 24, startY, subW, subH, 6);

            // Dati hardware
            fill(160); textSize(11);
            text(`Sub R: ${c.r}`, startX, startY + subH + 20);
            text(`Sub G: ${c.g}`, startX + subW + 12, startY + subH + 20);
            text(`Sub B: ${c.b}`, startX + (subW * 2) + 24, startY + subH + 20);


            // =================================================================
            // TESTI DI SPIEGAZIONE SCIENTIFICA (FOOTER)
            // =================================================================
            fill(255); textSize(12); textStyle(BOLD);
            textAlign(CENTER);
            text("IL GRANDE INGANNO:", width / 2, 420);
            
            fill(160); textSize(11); textStyle(NORMAL);
            let info = "A sinistra vedi lo spazio di tutti i colori esistenti. Il triangolo bianco mostra l'unico spazio accessibile alla tecnologia RGB.\n";
            if (val > 100 && val < 190) {
                info += "In questo momento (zona VERDE/CIANO) il punto si trova vicino ai bordi esterni dell'occhio, ma lo schermo lo sta costringendo\nall'interno del triangolo. Quello che vedi sul monitor è solo una versione sbiadita del colore chimico reale.";
            } else {
                info += "Ogni volta che guardi un display, non stai vedendo la vera luce della natura, ma una miscela artificiale a tre canali\nche tenta (ma non sempre riesce) di convincere i tuoi coni retinici.";
            }
            text(info, width / 2, 440);
            textAlign(LEFT);
        }

        // Funzione per generare lo spettro nello slider
        function hueToRGB(h) {
            let r = 0, g = 0, b = 0;
            let x = (1 - abs((h / 60) % 2 - 1)) * 255;
            if (h >= 0 && h < 60) { r = 255; g = x; }
            else if (h >= 60 && h < 120) { r = x; g = 255; }
            else if (h >= 120 && h < 180) { g = 255; b = x; }
            else if (h >= 180 && h < 240) { g = x; b = 255; }
            else if (h >= 240 && h < 300) { r = x; b = 255; }
            else if (h >= 300 && h <= 360) { r = 255; b = x; }
            return { r: floor(r), g: floor(g), b: floor(b) };
        }
    </script>
</body>
</html>
